        goal: >-
          Years of data work on HPCC Systems, packaged up: a bundle of the
          operations I kept rewriting, big-data benchmarks ported to the
          platform, and SASsy — a helper for SAS users trying to get their
          bearings in ECL.
        tech: [ECL, HPCC Systems]
        links:
          - label: ecl-bundle-lpezet
            url: https://github.com/lpezet/ecl-bundle-lpezet
          - label: SASsy
            url: https://github.com/lpezet/SASsy
          - label: hpcc_benchmarks
            url: https://github.com/lpezet/hpcc_benchmarks

      - name: Java patterns
        tagline: Circuit breakers, buffered iterators, and other repeat offenders.
        goal: >-
          The classes I kept re-implementing at work and on personal projects,
          collected in one place with tests — circuit breaker strategies being
          the ones that earned their keep.
        tech: [Java]
        links:
          - label: java
            url: https://github.com/lpezet/java

      - name: dbt Profiler
        tagline: Data profiling as a dbt package.
        goal: >-
          Column-level profiling that runs where the data already is, instead
          of pulling it somewhere else to look at it.
        tech: [dbt, SQL]
        links:
          - label: dbt-profiler
            url: https://github.com/lpezet/dbt-profiler

  - id: sidequests
    title: Side quests
    blurb: >-
      Not everything is infrastructure.
    projects:
      - name: Pressor
        tagline: A pressure sensor on a Seeed XIAO nRF52840.
        private: true
        goal: >-
          Embedded firmware on a BLE microcontroller, mostly to remember what
          it's like to work somewhere with no garbage collector and a hard
          memory ceiling.
        tech: [C++, PlatformIO, nRF52840]

      - name: Scribe
        tagline: Separating what happens in a story from how it's told.
        private: true
        goal: >-
          A story-generation approach that splits an immutable axiom layer —
          events, setting, cause and effect — from a style layer that can be
          swapped freely. Same chain of events, delivered as noir or as gothic.
        challenge: >-
          Keeping the two layers genuinely independent. Models want to let
          style leak into the facts, and once the voice starts changing what
          happened, there's nothing left to swap.
        tech: [LLMs, Prompt design]
