# Every recipe on /breads/. This is the file you edit.
#
# Everything else on that page — the conversion table, the "where to start"
# cards, the closing lists — is plain HTML in breads/index.html. Only the
# recipes live here, because only the recipes repeat.
#
# Recipes are numbered in the order they appear; the numbers are generated,
# so inserting one renumbers the rest. Each carries `name`, `date`, an
# optional `prov`, a `historical` and a `kitchen` block, and a `swap` line.
#
# A block is an ordered list of nodes, one key each:
#
#   p        a paragraph
#   warn     the tan caveat box
#   steps    a numbered list
#   text     a paragraph of method, not numbered
#   note     small print under the method
#   subhead  a label above a formula, when a recipe has more than one
#   form     rows: [{item, amount}], plus an optional `total` row
#
# Percentages in a form are baker's percentages against the flour in that same
# formula, so the water row shows hydration as mixed. The `total` row's figure
# is the whole dough, which also counts the flour and water inside the Lev'blé
# — hence the point or two of difference between the two.
#
# Every string is rendered as HTML, not escaped, so <b>, <i> and <a> work.
# Use <span class="no"> for the red "no honest substitute" styling.

sections:
  - title: I. Prehistory
    recipes:
      - name: Shubayqa flatbread
        date: c. 14,400 BP · Jordan
        prov: >-
          Natufian, Black Desert. The oldest bread anyone has ever excavated. Arranz-Otaegui et al., <i>PNAS</i>
          2018.
        historical:
          - p: >-
              Ground wild einkorn, wild barley and possibly oat, <b>mixed with club-rush tubers</b>. Dehusked,
              ground, and properly sieved — 41% of particles under 0.3 mm, finer than most later Neolithic bread.
              Definitively unleavened: mean void size 0.15 mm against >1 mm in a raised loaf. Baked in the ashes
              of a fireplace or on a hot flat stone; there are no ovens anywhere at this date.
          - p: >-
              <b>No ratio survives.</b> The paper gives no cereal-to-tuber proportion — the 75:25 below is my
              inference, weighted toward cereal because the tuber flour alone is barely palatable. The excavators
              tasted the tuber flour and described it as "quite gritty and salty, but a bit sweet as well."
        kitchen:
          - form:
              rows:
                - item: Einkorn wholemeal, unsifted
                  amount: 90 g · 45%
                - item: Barley wholemeal
                  amount: 40 g · 20%
                - item: Oat flour (blitzed oatmeal)
                  amount: 20 g · 10%
                - item: Tigernut flour
                  amount: 50 g · 25%
                - item: Water
                  amount: 130 g · 65%
                - item: Salt (not evidenced — see below)
                  amount: 1 g · trace
              total:
                item: Five flatbreads, ~12 cm × 5 mm
                amount: 331 g
          - steps:
              - Mix to a stiff paste. No kneading — there's nothing to develop.
              - >-
                Rest 20 minutes. The soak matters: the archaeological starch is fully gelatinised, so the flour
                was wet before it met heat.
              - Press to ~12 cm discs, 5 mm thick.
              - >-
                Bake directly on a stone or steel at <b>250–280 °C, 3–4 minutes a side</b>. If you have a wood
                fire, bury them in the ash instead — that's the attested method.
          - note: >-
              The salt isn't evidenced any more than it is in Ötzi's cracker below — I've kept a trace here
              only because <i>Bolboschoenus glaucus</i> grows in brackish water and both excavators independently
              described the tuber flour as tasting salty. Drop it for strict fidelity. Expect a dense, sandy,
              faintly sweet cracker with a saline edge. It is not good. It is, however, close to what it tasted
              like — Tobias Richter: "it is probably not to our particular tastes in the present."
        swap: >-
          <b>Wild einkorn</b> <span class="arrow">→</span> your einkorn (domesticated, larger grain, otherwise
          the same plant) · <b>club-rush tuber</b> <span class="arrow">→</span> tigernut flour (same sedge
          family, same fibrous cell walls, same sweet-gritty profile) · <b>wild barley &amp; oat</b> <span
          class="arrow">→</span> hulled barley and oatmeal. Drop the tigernut and you have a plausible flatbread;
          you do not have <i>this</i> flatbread.
      - name: Ötzi's cracker
        date: c. 3300 BC · South Tyrol
        prov: >-
          Reconstructed from the Iceman's gut contents. Rollo et al. 2002; Maixner et al., <i>Current Biology</i>
          2018.
        historical:
          - p: >-
              Einkorn bran dominates the cereal residue — about 45% of the tissue in the colon sample. The particle
              size shows fine grinding on a saddle quern, which is why Klaus Oeggl reads it as bread rather
              than porridge: gruel would leave coarse whole fragments. <b>Charcoal particles are stuck to the
              bran</b>, so it was baked on a hot rock or beside a fire. Barley is in the same gut, so this was
              not necessarily 100% einkorn.
          - p: >-
              Oeggl's own verdict on the product: "probably hard, somewhat like a cracker, and rather tough
              on the teeth."
          - p: >-
              <b>No experimental reconstruction of this bread has ever been published.</b> Anything sold as
              an "Ötzi bread recipe" is invention. So is the "5,300-year-old sourdough" story — the yeast revived
              from his body in 2026 is <i>Glaciozyma</i>, a cold-adapted glacier yeast that colonised the corpse,
              not a Neolithic bread culture.
        kitchen:
          - form:
              rows:
                - item: Einkorn wholemeal, unsifted
                  amount: 200 g · 100%
                - item: Water
                  amount: 112 g · 56%
              total:
                item: Six crackers, ~15 cm
                amount: 312 g
          - steps:
              - Mix, knead 60 seconds only, rest 20 minutes covered.
              - Roll to <b>2–3 mm</b> — thinner than feels right. Cut 15 cm discs.
              - >-
                Bake on a stone at <b>250–280 °C, 2–3 minutes a side</b>, until dry and blistered with a few dark
                spots.
              - Cool on a rack. They must ring hollow and snap.
          - note: >-
              No salt and no leaven — neither is evidenced. If you want it edible rather than accurate, 3 g
              salt. If you have a fire, bake it on a stone at the edge of the coals and let a little ash touch
              the surface; the charcoal specks are the one detail the microscopy actually gives us.
        swap: >-
          <b>Einkorn</b> <span class="arrow">→</span> <b>einkorn.</b> Nothing to convert. Mill it coarse rather
          than fine if your mill allows — a saddle quern doesn't produce a uniform particle size, and the
          flake-like bran is the diagnostic feature of the original.
      - name: Zürich galette
        date: 3176–3153 BC · Switzerland
        prov: >-
          Parkhaus Opéra lakeshore settlement, layer 13. Heiss et al., <i>PLOS ONE</i> 2017. Two discs, 6
          cm and 10.1 cm.
        historical:
          - p: >-
              Find 2285 is <b>barley alone</b> — a single-species galette, 6 cm across, about 2 cm thick. Find
              2907 is barley plus a <i>Triticum</i>, and carries <b><i>Apium graveolens</i></b> — celery. That
              is the first evidence for a bread condiment anywhere in the Neolithic.
          - p: >-
              Deliberately mixed grind, and the two differ: <b>2285</b> runs roughly 29% fine flour / 35% semolina-grade
              / 36% coarse grist, while <b>2907</b> is noticeably finer at 43% / 24% / 15%. 2285 is about 2.1
              cm thick, 2907 about 3.2 cm. Both are <b>"clearly unleavened, and therefore flat breads (galette)"</b>
              — under 5% of cavities exceed 1 mm. No intact starch granules survive, so the dough was wet before
              it met heat. The charring itself is read as a <b>baking accident</b>: these are two burnt ones.
          - p: >-
              <b>No reconstruction of these has been published.</b> The temperatures below are borrowed from
              EXARC's Iron Age tannur experiments — floor 350–500 °C, walls 100–120 °C, 10 minutes.
        kitchen:
          - form:
              rows:
                - item: Barley wholemeal, deliberately uneven grind
                  amount: 200 g · 100%
                - item: Water
                  amount: 120 g · 60%
                - item: Celery seed, crushed (for 2907)
                  amount: 1 g
              total:
                item: Two galettes, 10 cm × 2 cm
                amount: 321 g
          - steps:
              - >-
                Mill or buy barley meal, then <b>sieve and recombine deliberately</b>: about a third fine, a third
                semolina-grade, a third coarse grist. The mixed particle size is the archaeologically distinctive
                feature and it changes the texture completely.
              - Mix to a stiff paste, rest 30 minutes. No kneading — barley has no gluten to develop.
              - >-
                Form two discs 10 cm across, 2 cm thick. Press the crushed celery seed into the surface for the
                2907 version.
              - >-
                Bake on a stone at <b>220–230 °C for 20–25 minutes</b>. Resist the urge to go hotter: these are
                2 cm thick and gluten-free, so a fierce bake chars the outside while the middle stays wet meal.
                (The 350–500 °C figures from the Iron Age tannur experiments are for thin breads slapped on an
                oven wall — a different object.) It won't rise, and shouldn't.
        swap: >-
          <b>Barley</b> <span class="arrow">→</span> <span class="no"><b>barley. Don't substitute.</b></span>
          This recipe is a single-grain object and the grain is the whole point. Rye at 60% would give you
          a workable disc but a fundamentally different bread — barley reads sweet and mealy, rye reads sour
          and gummy. For 2907, use <b>khorasan</b> as the <i>Triticum</i> at roughly 50:50.
  - title: II. Bronze Age
    recipes:
      - name: The Küllüoba loaf
        date: c. 2993 cal BC · Anatolia
        prov: >-
          Eskişehir, Turkey. Found beside a doorway, a piece torn off, then carbonised and sealed under sterile
          soil — a deposit at the ritual abandonment of the building. Karaburun et al., <i>PLOS ONE</i> 2025.
        historical:
          - p: >-
              <b>Emmer, with lentil "in small amounts."</b> Oval, <b>12 cm across and 2.5 cm thick</b>. The
              flour was <b>not sieved</b> — rachis fragments are still in it. SEM shows irregular air voids
              of varied size, which the authors read as kneaded and <i>possibly</i> leavened, hedged carefully.
              Thermal analysis puts the bake above <b>150–160 °C</b>, and the starch granules kept their structure,
              so it was <b>brief</b>.
          - warn: >-
              <b>What the paper does not say.</b> The loaf contains no einkorn, no barley and no bulgur. The
              commercial "Küllüoba ekmeği" that Eskişehir's municipal bakery launched in 2025 — 300 g, 50 lira,
              300 a day — is reported as <i>kavılca</i> wheat (which is emmer, so that part is faithful) plus
              <b>lentils and bulgur</b>. The bulgur has no basis in the find. No formula, hydration or baking
              temperature has been released, and press descriptions of the blend vary, so treat the commercial
              loaf as inspired-by rather than reconstructed.
        kitchen:
          - form:
              rows:
                - item: Khorasan wholemeal, unsifted
                  amount: 480 g · 90%
                - item: Lentil flour (green or brown, whole)
                  amount: 53 g · 10%
                - item: Water
                  amount: 367 g · 69%
                - item: Lev'blé
                  amount: 25 g · 4.7%
                - item: Salt
                  amount: 8 g · 1.5%
              total:
                item: Two oval loaves
                amount: 933 g
          - steps:
              - >-
                Mill the khorasan and <b>do not sift it</b> — the coarse fraction is the point. Blitz whole lentils
                to flour in a spice grinder if you don't have it.
              - >-
                Mix everything, hold back 30 g water and add it only if the dough feels tight. Khorasan takes
                less than emmer.
              - >-
                Knead lightly, 4–5 minutes. Bulk <b>5–6 hours</b> at 24 °C — the "possibly leavened" reading
                supports a modest rise, not a doubled one, so stop when it has grown by about a quarter and
                feels alive rather than airy.
              - >-
                Divide and shape two ovals. The find is <b>12 cm across and 2.5 cm thick</b> — to land there <i>after</i>
                proof and oven spring, roll them out to about 1.5 cm and keep them tight; a 2.5 cm raw oval will
                finish closer to 4.
              - >-
                Bake on a stone at <b>210–230 °C for 12–15 minutes</b>. Short and moderate — the intact starch
                granules argue against a long fierce bake.
          - note: >-
              Salt isn't evidenced but isn't excluded either; drop it for fidelity. This is the recipe on this
              page where your grain is closest to the original — you are baking one subspecies of <i>Triticum
              turgidum</i> in place of another.
        swap: >-
          <b>Emmer</b> <span class="arrow">→</span> <b>khorasan.</b> The best swap in the collection: <i>T.
          turgidum</i> ssp. <i>dicoccum</i> → <i>T. turgidum</i> ssp. <i>turanicum</i>, same species. Two
          differences to manage — khorasan is free-threshing so you skip the parching and pounding, and it
          absorbs about 12 points less water (Samuel measured emmer wholemeal at 82%; run khorasan at 70%
          and adjust up).
      - name: Egyptian mould bread
        date: c. 2000–1200 BC · Egypt
        prov: >-
          The only ancient bread with a complete, tested, numeric protocol. Adeline Bats, <i>J. Archaeol.
          Sci.: Reports</i> 2020 — 54 loaves baked in replica conical moulds. Grain identification from Delwen
          Samuel's microscopy on ~70 desiccated loaves.
        historical:
          - p: >-
              "Almost all examined loaves are made from emmer wheat." Samuel's key working number: <b>emmer
              flour needs 82% water</b> against 69.2% for modern bread wheat. Dehusking was done by dampening
              the spikelets to soften the chaff, then pounding in a mortar.
          - p: >-
              Bats' winning formula, verbatim: <b>1000 g black emmer wholemeal, 750 g water, 170 g einkorn sourdough
              starter, 15 g salt.</b> Note that Bats' own dough runs at <b>75%</b>, not Samuel's 82% — the two
              numbers measure different meals, and the gap is mostly milling coarseness.
          - p: >-
              Moulds of local clay tempered with dung and gravel, coated inside with fine sandy clay as a release
              agent, laid horizontally in an open ash-and-charcoal fire kept below 500 °C, rolled with a poker
              every five minutes. Bats reports <b>60 minutes of baking between 100 and 120 °C</b> — that is
              the baking environment inside the sealed mould, not the crumb, which can't exceed ~100 °C while
              it's still moist. Result: fully baked, well-honeycombed crumb, clean release.
          - p: >-
              Ed Wood and Mark Lehner's 1993 replica bakery at Giza found the other essential detail: <b>without
              a preheated lid the bread does not bake through.</b> Their failure mode was over-souring — the
              lactobacilli took over on a long stand.
        kitchen:
          - form:
              rows:
                - item: Khorasan wholemeal
                  amount: 557 g · 100%
                - item: Water
                  amount: 378 g · 68%
                - item: Lev'blé, built with einkorn
                  amount: 26 g · 4.7%
                - item: Salt
                  amount: 8 g · 1.4%
              total:
                item: One tall loaf (Bats' formula, halved)
                amount: 969 g
          - steps:
              - >-
                Build your Lev'blé on einkorn flour the night before — Bats used an einkorn starter and it's what
                you have.
              - >-
                Mix, knead 5 minutes, bulk <b>6–7 hours</b> at 24 °C, until risen by half. Over-souring is
                the documented failure mode of this bread — it is exactly what sank the 1993 Giza
                reconstruction — so go by smell and stop while the dough is still sweet. The smaller dose of
                Lev'blé buys you a slower, milder rise than a stiff levain would; it does not buy you
                permission to leave it overnight.
              - >-
                <b>The mould.</b> Two unglazed terracotta flowerpots, ~18 cm, drainage holes plugged with foil.
                Season them, then preheat both in the oven for 30 minutes. Dust the inside of the baking pot heavily
                with flour.
              - >-
                Half-fill the hot pot with dough, invert the second pot over it as a lid, and seal the join loosely
                with foil.
              - >-
                Bake at <b>230 °C for 60 minutes</b>, lid on throughout. The sealed mould is what holds the interior
                in Bats' 100–120 °C band; without the lid it does not bake through, which is the single clearest
                finding from the Giza replica bakery.
              - Lift the lid for the last 10 minutes if you want colour.
          - note: >-
              Nathan Myhrvold's suggestion, after watching the Giza reconstruction, was that the original dough
              was <b>batter-like</b> — closer to muffin batter than a kneadable dough. If you want to test that
              reading, push to 90% hydration and pour rather than shape.
        swap: >-
          <b>Emmer</b> <span class="arrow">→</span> <b>khorasan</b>, Bats' 75% dropped to 70% for the stronger,
          finer-milled grain. <b>Einkorn starter</b> <span class="arrow">→</span> <b>Lev'blé fed on einkorn</b>
          — one refresh on einkorn flour gets you there. <b>Bedja mould</b> <span class="arrow">→</span> <b>two
          terracotta flowerpots.</b> The preheated lid is the non-negotiable part; the clay is not.
  - title: III. Greece and Rome
    recipes:
      - name: Maza
        date: Classical Greece
        prov: >-
          The everyday food of most Greeks. Not a bread in any modern sense — and mostly not baked at all.
        historical:
          - p: >-
              The lexical split matters: <b>ἄλφιτα (alphita) is barley meal, ἄλευρον (aleuron) is wheat flour.</b>
              Maza is made from alphita, artos from aleuron, and the two never cross.
          - p: >-
              <b>The barley was parched or roasted before milling</b> — necessary to release the hull, and it
              means the meal arrives already cooked. That is why maza needed no baking. Paulus Aegineta gives
              the clearest ancient statement: <i>"The maza consisted of toasted barley flour pounded with liquor,
              such as water, oil, milk, oxycrate, oxymel, or honied water."</i> That list is your formulation
              matrix.
          - p: >-
              Athenaeus preserves a dozen named types — <b>physte</b> (coarse Athenian), <b>amolgaia</b> (with
              goat's milk, Hesiod's), <b>kardamale</b> (with cress), <b>thridakiskai</b> (eaten with lettuce),
              <b>achilleum</b> (very fine barley, the luxury grade), <b>etnitas</b> (with pulses), <b>daratos</b>
              (unleavened). Archestratus rated Lesbian barley the finest, "whiter than snow."
          - warn: >-
              <b>Two different things share this name.</b> Classical maza proper is a cold-kneaded paste of
              roasted barley meal, eaten uncooked and dipped in broth. Baked barley flatcakes are the other
              tradition. Most modern "maza" recipes silently deliver the second. Both are below.
        kitchen:
          - subhead: <b>(a) Maza proper — no baking</b>
          - form:
              rows:
                - item: Barley meal, dry-toasted
                  amount: 150 g · 100%
                - item: Water
                  amount: 120 g · 80%
                - item: Olive oil
                  amount: 27 g · 18%
                - item: Salt
                  amount: 2 g
          - text: >-
              Toast the barley meal dry in a wide pan over medium-high heat, stirring, until deep brown and
              unmistakably nutty — 6–8 minutes. Off the heat, stir in water, oil and salt to an even thick paste.
              Cool, then shape into cakes by hand. <b>Eat as is</b>, dipped in broth, or with honey and fresh
              cheese. Substitute any of Paulus's liquids for the water: goat's milk for <i>amolgaia</i>, honey-and-vinegar
              for the oxymel version, watered wine.
          - subhead: <b>(b) Baked barley cakes — Farrell Monaco's <i>pharmakos</i> version</b>
          - form:
              rows:
                - item: Barley flour
                  amount: 325 g · 100%
                - item: Water
                  amount: 120 g · 37%
                - item: Whole milk
                  amount: 30 g · 9%
                - item: Oxymel (honey + vinegar)
                  amount: 30 g
                - item: Olive oil
                  amount: 15 g
                - item: White wine
                  amount: 15 g
              total:
                item: Total liquid 210 g
                amount: ~65%
          - text: >-
              <b>Do not knead.</b> Combine gently to a firm dough, rest 2 hours under a damp cloth, roll to
              <b>5 mm</b>, cut rounds, bake <b>200 °C for 20–30 minutes</b>. Serve with fresh cheese, dried
              figs and poppy seed.
        swap: >-
          <b>Barley</b> <span class="arrow">→</span> <span class="no"><b>barley.</b></span> Again no substitute
          — and here the roasting step is half the recipe. Don't skip it: untoasted barley meal gives you
          a raw pasty thing, toasted gives you the nutty character the whole dish is built on. <b>Oxymel</b>
          <span class="arrow">→</span> 2 parts honey to 1 part red wine vinegar, warmed to dissolve.
      - name: Artolaganon
        date: Classical Greece
        prov: >-
          The wheaten loaf — <i>artos</i>, the feast-day bread against everyday maza. This is the one Greek
          type with enough textual detail to formulate directly.
        historical:
          - p: >-
              Athenaeus preserves Chrysippus of Tyana's catalogue of loaves, sorted by leaven, oven and enrichment:
              <b>zymites</b> (leavened), <b>klibanites</b> (baked in the portable bell oven), <b>ipnites</b>
              (built oven), <b>escharites</b> (brazier, "soft and delectable… dipped in sweet wine"), <b>spodites</b>
              (ash-baked), <b>pyrnon</b> (unsifted, wholemeal), <b>dipyros</b> (twice-baked).
          - p: >-
              One genuinely technical observation survives, from Chrysippus on the <b>artopticius</b>: <i>with
              hard yeast, it will be white</i>, against <i>dissolved yeast</i>, which gives a lighter but less
              white loaf. That is a real observation about stiff versus liquid levain and its effect on crumb
              colour, made two thousand years before anyone had a word for it.
          - p: >-
              The <b>artolaganon</b> line: <i>"a little wine, pepper, and milk … oil or lard."</i> The <b>hapalos
              artos</b> ("soft bread," Cappadocian): <i>"with a little milk and oil and sufficient salt,"</i>
              dough kept <i>"quite soft,"</i> best eaten hot.
        kitchen:
          - form:
              rows:
                - item: T65 Blanche
                  amount: 680 g · 100%
                - item: Whole milk
                  amount: 370 g · 54%
                - item: Lev'blé
                  amount: 31 g · 4.6%
                - item: White wine
                  amount: 30 g
                - item: Olive oil
                  amount: 25 g
                - item: Salt
                  amount: 12 g · 1.8%
                - item: Black pepper, coarse
                  amount: 2 g
              total:
                item: Four thin discs
                amount: 1150 g
          - steps:
              - >-
                Knead thoroughly, adding the milk gradually — this dough wants development, unlike almost everything
                else here.
              - <b>Rest overnight</b>, cool.
              - Re-knead briefly, divide in four, shape thin discs, rest 15 minutes.
              - >-
                Bake <b>230 °C, 15–20 minutes</b>, or under an inverted heavy pot if you want the <i>klibanos</i>
                effect.
          - note: >-
              For <b>hapalos artos</b> instead: 567 g T65, 373 g whole milk (66%), 40 g olive oil, 10 g salt,
              26 g Lev'blé. Keep it deliberately slack, bake hot, eat warm — the source insists on all
              three.
        swap: >-
          <b><i>Aleuron</i> / free-threshing wheat</b> <span class="arrow">→</span> <b>T65.</b> Straightforward:
          this is the prestige refined flour of its day and T65 is the modern equivalent grade. Use <b>T80</b>
          if you want the <i>pyrnon</i> (wholemeal) version instead. A period-plausible starter, if you want
          to go further: 500 g barley flour and water, roasted until browning, then left to sour for a week.
      - name: Panis quadratus
        date: AD 79 · Pompeii
        prov: >-
          The eight-segment Roman loaf, from the carbonised examples in the Bakery of Modestus. Four published
          reconstructions disagree instructively.
        historical:
          - p: >-
              The 2023 interdisciplinary study (Cardenas, Yarza, Matterne &amp; Arranz-Otaegui) makes the argument
              that matters: <b>most reconstructions use roller-milled flour, which produces a fundamentally
              different bread.</b> Stone-milling and sieving are the variables — not the shaping tricks. Their
              formula runs at <b>52% hydration</b>, well under everyone else's, <b>mixed but not kneaded, not
              autolysed, not folded</b>.
          - p: >-
              <b>A live dispute worth knowing about.</b> The 2023 team argue the equatorial groove comes from
              <b>two stacked dough discs</b>. Farrell Monaco, analysing all 81 carbonised loaves from Modestus's
              oven for the Bloomsbury <i>Handbook of Experimental Approaches to Roman Archaeology</i>, concludes
              <b>cord really was tied round the waist</b>. Nobody has settled it. Bake it either way.
          - p: >-
              The segments were <b>pressed, not cut</b> — blunt impressions radiating from a central navel.
              The low hydration is functional: the loaf has to hold a stamped impression and eight defined wedges
              without spreading.
        kitchen:
          - form:
              rows:
                - item: T80 Bise
                  amount: 716 g · 70%
                - item: Khorasan wholemeal
                  amount: 304 g · 30%
                - item: Water
                  amount: 540 g · 53%
                - item: Lev'blé
                  amount: 47 g
                - item: Salt
                  amount: 17 g · 1.7%
              total:
                item: One loaf, ~20 cm · total hydration ~54%
                amount: 1624 g
          - steps:
              - >-
                Mix everything to a shaggy mass and <b>stop</b>. No kneading, no autolyse, no folds — this is
                the 2023 study's central claim and it changes the crumb.
              - >-
                Single bulk ferment until doubled, <b>about 8 hours</b> at 24 °C.
              - >-
                Shape one ball — the Roman unit was four <i>librae</i>, about <b>1310 g</b>, so scale a piece
                to that and bake the remaining ~315 g as a test roll. Press gently into a 20 cm round tin or onto
                a peel.
              - >-
                <b>The groove, route A:</b> tie heavy untreated garden twine loosely round the waist. <b>Route
                B:</b> shape two discs and stack them. Try both and pick a side.
              - >-
                Press eight radiating segments with a thin dowel or the back of a knife — <b>press, don't cut</b>.
                Thumb a navel in the centre.
              - "Bake at <b>220 °C for 30 minutes: 20 covered, 10 uncovered.</b> Internal 93 °C."
        swap: >-
          <b><i>Siligo</i> (repeatedly sieved wheat)</b> <span class="arrow">→</span> <b>T80.</b> The Roman
          grades were an extraction ladder and so are the T numbers — T80 sits about where the everyday bakery
          grade did. Use T65 for a whiter, more aristocratic loaf. <b>The spelt</b> that every published reconstruction
          uses as its second flour <span class="arrow">→</span> <b>khorasan</b>: it's carrying flavour rather
          than structure there, so the tetraploid swap holds. Stone-mill the khorasan yourself if you can
          — the 2023 paper's whole point is that the milling matters more than the shaping.
      - name: The extraction ladder
        date: 1st c. AD · the sifting sidebar
        prov: >-
          Not a loaf. The procedure that produced all five of the loaves below, and the reason a Roman could
          read your rank off the colour of your bread.
        historical:
          - p: >-
              Rome had one wheat and many breads. The difference between them was not the grain, not the oven
              and not the leaven — it was <b>how many times the meal went through the sieve</b>. Pliny says it
              outright at <b>XVIII.105</b>: <i>"The excellence of the finest kinds of bread depends principally
              on the goodness of the wheat, and the fineness of the bolter"</i> — <i>tenuitate cribri</i>, the
              fineness of the mesh. Every social fact on this page follows from that one sentence.
          - p: >-
              The fractions had names. Milling and bolting a modius of wheat gave you <b><i>flos</i></b> or <b><i>pollen</i></b>
              (the "flower," the first and finest), <b><i>siligo</i></b> / <b><i>similago</i></b> (fine flour),
              <b><i>cibarium</i></b> — <i>"quod secundarium vocant,"</i> which they call seconds — and <b><i>furfures</i></b>,
              bran. Pliny XVIII.87. Four grades off one grain, and a separate market price for each.
          - p: >-
              <b>Pliny counts the siftings.</b> XVIII.90 is the only ancient passage that quantifies it, and it
              is worth having in full because it is the whole argument in one line: flour bolted <b>once</b> yields
              17 lb of bread to the modius, <b>twice</b> 18 lb, <b>three times</b> 19⅓ lb — <i>"semel … pollinatam
              XVII p. panis reddere, bis XVIII, ter XIX cum triente"</i> — plus 2½ lb of <i>secundarius</i>, as
              much again of <i>cibarium</i>, and six sextarii of bran. Sifting more does not give you more flour.
              It gives you <b>whiter</b> flour, and a growing pile of by-product you then have to sell to someone
              poorer.
          - p: >-
              And the sieves themselves were an industry. XVIII.108: <i>"The Gauls were the first to employ the
              bolter that is made of horse-hair; while the people of Spain make their sieves and meal-dressers
              of flax, and the Egyptians of papyrus and rushes."</i> The Latin names <b>two</b> Spanish types —
              <i>excussoria</i> (shaking sieves) and <b><i>pollinaria</i></b> (from <i>pollen</i>, the finest
              flour). Graded mesh sets, named after the fraction they were built to catch.
          - p: >-
              Galen ranks the results and gets the physiology right two millennia early. <i>Silignis</i> is <i>"the
              most nourishing of them; next is semidalis; and the one in the middle, wholemeal, is third. Fourth
              is the group from unwinnowed grain, of which the bran loaf is the worst."</i> But the ladder inverts
              for transit: the pure loaves bring <i>"the greatest weight to the smallest bulk"</i> and <i>"pass
              through the most slowly,"</i> while <i>"the bran has a cleansing property."</i> Galen's own etymology
              is a gift to bakers — <b><i>syncomistos</i></b> means the meal was <i>"brought together without
              being sifted,"</i> <b><i>autopyros</i></b> that <i>"the whole wheat itself is made into loaves."</i>
          - warn: >-
              <b>The tidy six-rung ladder you have read about is Victorian, not Roman.</b> Smith's <i>Dictionary
              of Greek and Roman Antiquities</i> (1890), s.v. PISTOR, groups <i>"panis cibarius, plebeius, castrensis,
              sordidus, rusticus, secundus, furfureus"</i> into one list, and essentially every food-history page
              since has copied it. But <b><i>panis rusticus</i>, <i>panis sordidus</i> and <i>panis furfureus</i>
              are not attested as fixed phrases in classical Latin</b> — they are absent from the Lewis &amp;
              Short entry for <i>panis</i>, which collects the real ones: <i>cibarius</i> (Cicero), <i>secundus</i>
              (Horace), <i>ater</i> (Terence), <i>plebeius</i> and <i>siligneus</i> (Seneca), <i>siligine</i>
              (Juvenal), <i>nauticus</i> (Pliny). The grades below are real; the <b>ladder</b> is a modern tidy-up
              of terms that came from different authors, genres and centuries. Bake them anyway — just don't
              tell anyone Rome had an official chart.
          - p: >-
              The hierarchy is real for a better reason than a word-list. It shows up in a household ledger. <b>CIL
              IV 5380</b>, a day-by-day expense graffito from Pompeii, buys <b>three separate bread lines on
              the same day</b> — plain <i>bread</i>, <i>black bread</i>, and <i>panem puero</i>, "bread for the
              slave-boy," commonly 8 asses against 2. Not a senator's dinner party. An ordinary inn, buying
              two grades of bread because two grades of person were going to eat it. <b>The daily figures are
              totals, not unit prices</b> — we don't know how many loaves — so take the 4:1 as a ratio, not a
              price list.
        kitchen:
          - text: >-
              <b>You already own the ladder.</b> T65 · T80 · T110 · T170 <i>is</i> an extraction series, which
              is why the five loaves below need no conversion table — just walk down your own shelf. But sift
              your own at least once, because the ancient constraint only becomes obvious when you are the one
              throwing flour away.
          - subhead: <b>Bolting wholemeal into grades, at home</b>
          - form:
              rows:
                - item: Wholemeal, stone-ground, from your Vitamix dry container
                  amount: 1000 g
                - item: Sieve 1 — ~500 µm (a #35 drum or fine tamis)
                  amount: pass 1
                - item: Sieve 2 — ~250 µm (#60)
                  amount: pass 2
                - item: Sieve 3 — ~180 µm (#80 flour sifter)
                  amount: pass 3
              total:
                item: Roughly T110 · T80 · T65-ish, plus bran and middlings
                amount: 1000 g in, ~700 g white out
          - steps:
              - >-
                Mill as fine as your grinder will go. The Roman quern could not, which is why they sifted rather
                than milled their way to white — but the finer you start, the less you lose.
              - >-
                <b>Pass 1, ~500 µm.</b> What goes through is roughly a <b>T110</b>. What stays behind is coarse
                bran. Keep it — it is the <i>furfur</i>, and it has its own loaf below.
              - >-
                <b>Pass 2, ~250 µm.</b> Through is roughly <b>T80</b>. The tailings here are the fine bran and
                germ — this is the fraction that carries the flavour, and losing it is the actual price of white
                bread.
              - >-
                <b>Pass 3, ~180 µm.</b> Through is your <b>T65-ish</b>. Stop. A fourth pass returns almost nothing
                and this is exactly where a Roman bakery stopped too.
              - >-
                Weigh every fraction. That number — how much you threw at the pigs to get the white — is the
                entire economics of Roman bread, and you can feel it in your hands in about twenty minutes.
          - note: >-
              <b>Those percentages are mine, not scholarship's.</b> They are what my sieve stack yields, and
              they will not match yours. I want to be blunt here because the internet is not: <b>there is no
              published scholarly estimate of the extraction rate ancient "white" flour actually reached.</b>
              Moritz's <i>Grain-Mills and Flour in Classical Antiquity</i> (1958) remains the standard reference
              and is not online in any form. Pliny's yield figures at XVIII.86–89 are <b>volumetric, and they
              don't balance</b> — 4 + 8 + 4 + 4 sextarii out of a 16-sextarius modius is a known corruption in
              the transmitted text. Anyone quoting you a clean "Roman flour was X% extraction" has invented the
              conversion. What you can say with confidence is <b>relative</b>: siligo whiter than secundarium,
              secundarium whiter than cibarium, and every step cost labour.
        swap: >-
          <b>Horsehair bolter</b> <span class="arrow">→</span> <b>a nested drum sieve or three tamis.</b> Horsehair
          cloth is still made for exactly this and is not expensive; if you want the tactile version, buy one
          and you will understand the <i>pollinaria</i> immediately. <b><i>Modius</i></b> <span class="arrow">→</span>
          8.62 litres, <b><i>libra</i></b> <span class="arrow">→</span> 327 g, if you want to check Pliny's
          arithmetic yourself. You should. It doesn't work, and knowing why is more useful than the number.
      - name: <i>Panis siligineus</i>
        date: 1st c. AD · Rome
        prov: >-
          The top of the ladder. Pliny's <i>lautissimus panis</i>, Juvenal's snow-white roll, and the loaf
          the client at the table was not allowed to touch.
        historical:
          - p: >-
              Pliny XVIII.86, on <i>siligo</i> — soft white bread wheat, <i>Triticum aestivum</i>: <i>"e siligine
              lautissimus panis pistrinarumque opera laudatissima"</i> — "winter wheat furnishes bread of the
              very finest quality and the most esteemed delicacies of the bakers." He rates the price at XVIII.90:
              meal 40 asses the modius, <i>similago</i> eight asses more, and <b>bolted <i>siligo</i> at double</b>.
              Same field, same grain, twice the money, and the only difference is sieving.
          - p: >-
              <b>Juvenal, <i>Satire</i> 5.67–75</b>, is the passage that matters, because it puts both ends of
              the ladder on one table. The client is handed <i>"a bit of hard bread that you can scarce break
              in two, or lumps of dough that have turned mouldy — stuff that will exercise your grinders and
              into which no tooth can gain admittance."</i> Then: <i>"For Virro himself a delicate loaf is reserved,
              white as snow, and kneaded of the finest flour"</i> — <i>tener et niveus mollique siligine fictus</i>.
              Reach for it and a slave stops you: <i>"What, Sir Impudence? Will you please fill yourself from
              your proper tray, and <b>learn the colour of your own bread</b>?"</i>
          - p: >-
              <i>Panisque tui novisse colorem.</i> That is the whole thesis of this section of the page. Roman
              rank was legible at arm's length, in the crumb.
          - warn: >-
              <b>No recipe for this loaf survives. None.</b> Not for any of the five below either. Rome left
              us grade names, prices, yields and sieve materials — it did not leave us a formula, because the
              formula was not the variable. <b>The flour was the variable.</b> So the five loaves here are deliberately
              <b>the same dough five times</b>, differing only in extraction and the water it takes. That is
              not a shortcut; it is the argument. Bake two of them in one afternoon and you will taste what
              the entire hierarchy actually consisted of.
        kitchen:
          - form:
              rows:
                - item: T65 Blanche
                  amount: 567 g · 100%
                - item: Water
                  amount: 340 g · 60%
                - item: Lev'blé
                  amount: 26 g · 4.6%
                - item: Salt
                  amount: 11 g · 1.9%
              total:
                item: One loaf · total hydration ~61%
                amount: 944 g
          - steps:
              - >-
                Mix, then knead properly — <b>8–10 minutes</b>. Galen is explicit that the best bread is the one
                <i>"kneaded by the baker to the greatest extent,"</i> and at this extraction you have the gluten
                to reward it.
              - >-
                Bulk <b>7–8 hours</b> at 24 °C — until half again its volume and domed — with two folds in
                the first two hours. Galen again: the healthiest loaf has <b>"the most leaven and the most
                salt"</b> and is <b>"very well baked"</b> — that is a fully proofed, fully fermented bread,
                not a lean one.
              - Shape tight, final proof 1½–2 hours.
              - "Bake covered at <b>240 °C for 20 minutes</b>, then uncovered at 210 °C for 20–25. Internal 96 °C."
          - note: >-
              Expect an open, pale, soft crumb and a thin crust — and expect it to taste <b>faintly of not very
              much</b>. That is correct. The flavour left with the germ, three sieves ago. If it strikes you
              as a slightly boring loaf, you have understood something true about status foods.
        swap: >-
          <b><i>Siligo</i>, thrice-bolted</b> <span class="arrow">→</span> <b>T65 Blanche.</b> The honest grade
          match, and the same one the <i>artolaganon</i> uses. <b>Your King Arthur Bread Flour is the interesting
          wrong answer:</b> at ~12.7% protein and a lower ash than T65, roller-milled, it is <b>whiter than
          anything Rome could physically produce</b>. Bake it that way once — not because it is accurate, but
          because it shows you the thing Virro was <i>aiming</i> at and could never quite buy. Add 3% water
          if you do; it drinks more than the T65.
      - name: <i>Panis secundarius</i>
        date: c. AD 14 · Rome
        prov: >-
          Second sifting. The grade Suetonius says the emperor Augustus actually preferred — and the one place
          the ladder gets rhetorically inverted.
        historical:
          - p: >-
              <b>Suetonius, <i>Divus Augustus</i> 76.1</b>: <i>"Cibi — nam ne haec quidem omiserim — minimi erat
              atque uulgaris fere. <b>Secundarium panem</b> et pisciculos minutos et caseum bubulum manu pressum
              et ficos uirides biferas maxime appetebat."</i> Rolfe: "He was a light eater and as a rule of plain
              food. He particularly liked <b>coarse bread</b>, small fishes, hand-made moist cheese, and green
              figs of the second crop."
          - p: >-
              <b>Read the framing, not just the noun.</b> Suetonius sets it up with <i>cibi … uulgaris fere</i>
              — his food was "generally of the common sort" — and the chapter is a portrait of studied <i>civilitas</i>,
              an emperor performing ordinariness. This is not evidence that good bread was scarce in the Palatine.
              It is evidence that <b>eating down the ladder was a legible gesture</b>, which only works if everybody
              could read the ladder. Popular retellings flatten this into "even the emperor ate cheap bread."
              He ate it <i>at</i> people.
          - p: >-
              Horace gets there first, <i>Epistles</i> 2.1.123 — the poet who <i>"uiuit siliquis et <b>pane secundo</b>"</i>,
              lives on pulse and second bread. Same move, a generation earlier: second-grade bread as the badge
              of the harmless, unmilitary, unbought man.
          - p: >-
              Pliny's <i>secundarium</i> is the fraction itself, XVIII.87 — <i>cibarii, quod secundarium vocant</i>
              — so the word does double duty as a milling term and a moral one. Handy, if you are a satirist.
        kitchen:
          - form:
              rows:
                - item: T80 Bise
                  amount: 567 g · 100%
                - item: Water
                  amount: 363 g · 64%
                - item: Lev'blé
                  amount: 26 g · 4.6%
                - item: Salt
                  amount: 11 g · 1.9%
              total:
                item: One loaf · total hydration ~65%
                amount: 967 g
          - steps:
              - Mix, knead 8 minutes. Slightly slacker than the T65 and it will feel it.
              - >-
                Bulk <b>7–8 hours</b> at 24 °C, until half again its volume, with two folds early on.
              - Shape, proof 1½ hours.
              - "Bake covered <b>240 °C, 20 minutes</b>, uncovered 210 °C, 20 minutes."
          - note: >-
              <b>This is the one to bake if you only bake one.</b> T80 sits almost exactly where the everyday
              Roman bakery grade did, it is what the <i>panis quadratus</i> above is built on, and it is — not
              coincidentally — the best-eating loaf of the five. Augustus was not slumming. He was choosing correctly
              and getting credit for humility.
        swap: >-
          <b><i>Similago</i> / twice-bolted flour</b> <span class="arrow">→</span> <b>T80 Bise.</b> Nothing
          to negotiate. If you want the Suetonian version with more conviction, cut it <b>85 T80 / 15 T110</b>
          — Rolfe's "coarse" has to earn its keep somehow, and the second-sifting tailings would have gone
          straight back in at a working bakery.
      - name: <i>Panis plebeius</i> and <i>panis cibarius</i>
        date: 1st c. BC – 1st c. AD · Rome
        prov: >-
          One loaf, two names, two registers. <i>Plebeius</i> is what the rich call it. <i>Cibarius</i> is
          what it is for.
        historical:
          - p: >-
              <b>Seneca, <i>Ep.</i> 118.16</b>, is the cleanest statement of the whole system, from a man rich
              enough for it to be cheap to say: <i>"Esurio: edendum est. Utrum hic panis sit <b>plebeius</b> an
              <b>siligineus</b> ad naturam nihil pertinet."</i> — "I am hungry: I must eat. Whether this bread
              is <i>plebeius</i> or <i>siligineus</i> is of no concern to nature." The two poles, named in one
              breath, as a shorthand he expects any reader to catch.
          - p: >-
              <b><i>Cibarius</i> is the more interesting word, and it is routinely mistranslated.</b> It comes
              from <i>cibus</i> — food, provender, fodder — and the neuter plural <i>cibaria</i> is the standard
              Latin for <b>rations issued</b> to slaves, soldiers and animals. Cato's chapter heading is <i>Familiae
              cibaria</i>, "rations for the household." So <i>panis cibarius</i> is not primarily "coarse bread."
              It is <b>issue bread</b>. The coarseness is a consequence of what you hand out, not the meaning
              of the word.
          - p: >-
              <b>Cicero, <i>Tusc.</i> 5.34.97</b> — the one secure classical citation: Ptolemy, lost in Egypt
              and separated from his retinue, is given <i>cibarius in casa panis</i> in a peasant's hut, and declares
              <i>"nothing ever seemed to him pleasanter than that bread."</i> The anecdote only works because
              ration bread is the agreed floor of edibility.
          - p: >-
              <b>What ration bread actually meant, in weights.</b> Cato, <i>De Agri Cultura</i> 56: field hands
              get <b>4 modii of wheat a month in winter, 4½ in summer</b> — raw grain, to mill themselves. The
              chained gang, <i>compediti</i>, get <b>4 pounds of baked bread a day, rising to 5 <i>"ubi vineam
              fodere coeperint"</i></b> — when they start digging the vineyard — then back to 4 when the figs
              ripen. Two things worth noticing. The ration <b>tracks the work</b>, explicitly. And men in shackles
              are issued <b>bread</b> rather than grain, because you cannot let a man in irons do his own milling.
              The <i>form</i> of the ration is itself a mark of status.
          - p: >-
              Columella assumes this bread was bad enough to need policing. The master is to <i>"test the quality
              of the bread and drink by his own taste"</i> — <i>panis potionisque bonitatem gustu suo exploret</i>
              — when inspecting the <i>ergastulum</i>. Juvenal's aesthetic point, from the management side.
        kitchen:
          - form:
              rows:
                - item: T110
                  amount: 567 g · 100%
                - item: Water
                  amount: 386 g · 68%
                - item: Lev'blé
                  amount: 26 g · 4.6%
                - item: Salt
                  amount: 11 g · 1.9%
              total:
                item: One loaf · total hydration ~69%
                amount: 990 g
          - steps:
              - >-
                Mix and rest 30 minutes before kneading — at this extraction the bran needs to hydrate or it will
                cut the gluten as you work it.
              - >-
                Knead 6–8 minutes. Bulk <b>7–8 hours</b> at 24 °C, three folds in the first three. It will
                rise by about half; at this extraction it will not double.
              - Shape gently. Proof 1¼ hours — it will not hold a long final proof.
              - "Bake covered <b>240 °C, 20 minutes</b>, uncovered 210 °C, 20–25."
          - note: >-
              <b>To bake it as a ration rather than as a loaf:</b> scale to the Roman daily unit. Four <i>librae</i>
              is about <b>1310 g of baked bread</b>, which from this formula means roughly <b>750 g of flour</b>
              — so multiply by 1.3 and bake it as one brick rather than one boule. Do that once and Cato's numbers
              stop being numbers. It is an enormous amount of bread, and it was very nearly the entire diet.
        swap: >-
          <b><i>Cibarium</i> / the seconds fraction</b> <span class="arrow">→</span> <b>T110.</b> If you sifted
          your own in the sidebar above, use the <b>pass-1 flour</b> — that is nearer the real thing than any
          bagged flour, because it still carries the middlings a commercial mill removes. <b><i>Plebeius</i></b>
          <span class="arrow">→</span> the same loaf. The words differ in who is speaking, not in what is on
          the table.
      - name: <i>Panis autopyrus</i> — and the <i>rusticus</i> problem
        date: c. AD 60 · Campania
        prov: >-
          Wholemeal, the whole grain, nothing sifted out. The loaf a rich freedman brags about preferring —
          and the place where the modern ladder quietly invents a rung.
        historical:
          - p: >-
              <b>Petronius, <i>Satyricon</i> 66.</b> Habinnas, describing the funeral dinner he has just staggered
              home from, lists the courses and then stops to make a point of one of them: <i>"panem <b>autopyrum</b>
              de suo sibi, quem ego malo quam candidum; nam et uires facit, et cum mea re causa facio, non ploro."</i>
              — "wholemeal bread of his own making, <b>which I prefer to the white</b>; it gives you strength,
              and when I relieve myself I don't weep about it."
          - p: >-
              That is a man who can afford <i>siligineus</i>, announcing at table that he chooses the coarse loaf,
              on health grounds, with a digestive testimonial. Petronius is mocking freedman taste — but Habinnas
              is <b>repeating the medical consensus correctly</b>. Galen says the same thing in better Greek:
              bran <i>"has a cleansing property,"</i> so <i>"elimination of the residues takes place quickly."</i>
              The oldest wellness bore in European literature, and he is not wrong.
          - p: >-
              <b><i>Autopyros</i></b> (αὐτόπυρος) is Greek — <i>auto-</i> + <i>pyros</i>, "the wheat itself" —
              and Galen glosses it exactly that way: so called <i>"since the whole wheat itself is made into loaves."</i>
              Its twin is <b><i>syncomistos</i></b> (σύγκομιστος), "brought together," because <i>"the meal is
              brought together without being sifted."</i> Athenaeus has the same family: <b><i>pyrnon</i></b>,
              <i>"bread made of unsifted wheat and containing all the elements of the grain"</i> — the term
              already used in the <i>artolaganon</i> above — and <i>erikitas</i>, <i>"a loaf made of coarsely
              cracked, unsifted wheat."</i>
          - warn: >-
              <b><i>Panis rusticus</i> is not a Roman phrase.</b> I went looking for it and it is not in Lewis
              &amp; Short's <i>panis</i> entry and not in any classical text I could reach. Where it turns up
              is <b>modern museum labelling</b> — the Parco Archeologico di Ercolano uses it in exhibition text
              for "entirely wholemeal bread" — and, upstream of nearly everything online, Smith's 1890 <i>Dictionary</i>.
              <b><i>Panis sordidus</i></b> is nearly as shaky: the adjective is used of bread once, by Seneca
              at <i>Ep.</i> 18.7, describing the props of <i>voluntary</i> poverty — <i>"panis durus ac sordidus,"</i>
              hard and filthy bread — which is a Stoic exercise, not a bakery grade. The bread on this page is
              real. Two of the names for it are ours.
        kitchen:
          - form:
              rows:
                - item: T170 (or your own unsifted wholemeal)
                  amount: 567 g · 100%
                - item: Water
                  amount: 420 g · 74%
                - item: Lev'blé
                  amount: 26 g · 4.6%
                - item: Salt
                  amount: 11 g · 1.9%
              total:
                item: One loaf · total hydration ~75%
                amount: 1024 g
          - steps:
              - >-
                <b>Autolyse 45 minutes</b> — flour and water only, no salt, no levain. Non-negotiable at this extraction.
              - >-
                Add levain and salt, knead 5 minutes only. Coil-fold four times over the first four hours,
                then leave it alone — <b>7 hours</b> of bulk in all at 24 °C, or until risen by about half.
              - >-
                Shape with a light hand and <b>cold retard 12 hours</b>. The cold is what makes this dough handleable;
                it is also completely unhistorical, and I would rather you got a loaf.
              - "Bake from cold, covered, <b>245 °C for 25 minutes</b>, then uncovered at 215 °C for 20."
          - note: >-
              <b>The honest version has no tin and no retard.</b> Mix at 70%, ferment 5 hours, press to a 3 cm
              round, bake on the stone at 230 °C for 35 minutes. Dense, dark, sour, chewy, and good in the specific
              way that a bread carrying all its own germ is good. That flat brown disc is what most people in
              the Roman world ate most days, and Habinnas was showing off by choosing it.
        swap: >-
          <b><i>Autopyros</i> / <i>syncomistos</i> / <i>pyrnon</i></b> <span class="arrow">→</span> <b>T170,
          or better, your own mill on its coarsest setting.</b> Bagged T170 is still a mill product with a
          controlled particle size; a quern is not. If you have the Vitamix dry container out anyway, run
          the berries short and <b>don't sieve at all</b> — the uneven grind <i>is</i> the bread. <b>Khorasan
          or einkorn wholemeal</b> both work here and both taste better than common wheat, but note you are
          then baking a nicer loaf than the one the sources describe.
      - name: <i>Panis furfureus</i> — the bran loaf
        date: 2nd c. AD · Pergamon and Rome
        prov: >-
          The bottom of the ladder, and the only rung whose Latin name we made up. In Greek it has a real
          one, and it is an insult.
        historical:
          - p: >-
              Galen, on the far end of his four-step scale: <i>"Fourth is the group from unwinnowed grain, of
              which the <b>bran loaf</b> is the worst. It is indeed <b>the least nourishing</b>, and of all the
              breads <b>it moves the bowels most</b>."</i> He is precise about how you get it, and it is not
              by adding bran — it is by <i>"sifting out the very fine meal"</i> and baking <b>what is left over</b>.
              This is the by-product loaf. Everything good has already been sold to somebody else.
          - p: >-
              The Greek word is <b>πιτυρίας</b>, <i>pityrias</i> — Pollux 6.72, Galen 6.481, and as <i>pityrites
              artos</i> in Athenaeus 114E. Eustathius notes it was <i>"a word of reproach."</i> Athenaeus preserves
              a second, lovelier one from the glossographers Amerias and Timachidas: <b><i>brattimê</i></b>, "bread
              made of bran." Alongside it he lists the <i>"dirty loaves"</i> a comic poet called <b>"grey-bread,"</b>
              and Cilician loaves that were emphatically <i>"not the clean, tidy kind."</i> <b><i>Rhyparos</i></b>
              (ῥυπαρός), the standard adjective, literally means <b>filthy</b>, and in the papyri it is what you
              call grain that has not been winnowed.
          - warn: >-
              <b><i>Panis furfureus</i> is a modern back-formation.</b> <i>Furfur</i> (bran) is thoroughly Roman
              — Pliny counts it as a milling fraction at XVIII.87 and XVIII.90 — but <b>I could not attest the
              phrase <i>panis furfureus</i> in any classical Latin text</b>, and it is absent from Lewis &amp;
              Short. It comes to us, like <i>rusticus</i> and <i>sordidus</i>, through Smith's 1890 list. <b>The
              bread is entirely real; the Latin label is ours.</b> If you want the attested name for it, use
              the Greek: <i>pityrias</i>.
        kitchen:
          - form:
              rows:
                - item: T170
                  amount: 507 g · 86%
                - item: Coarse bran — the sidebar's pass-1 tailings
                  amount: 85 g · 14%
                - item: Water
                  amount: 474 g · 80%
                - item: Lev'blé
                  amount: 27 g · 4.6%
                - item: Salt
                  amount: 12 g · 2%
              total:
                item: Two flat loaves · total hydration ~81%
                amount: 1105 g
          - steps:
              - >-
                <b>Soak the bran separately</b> in 170 g of the water for an hour, hot. Dry bran will shred what
                little gluten this dough can build.
              - Combine everything, mix 3 minutes, no real kneading. There is nothing here to develop.
              - >-
                Bulk <b>8–9 hours</b> at 24 °C, or nearer 7 somewhere warmer. It will not double, it will
                not dome, and it will not smell like the loaves above — with no gluten to hold anything
                there is no rise to read, so this is the one loaf here where you really are going by the
                clock. Fold it twice if it makes you feel better; it won't change much.
              - >-
                Divide in two, press into 2.5 cm rounds directly on the peel. Proof 45 minutes.
              - "Bake on a stone at <b>230 °C for 35–40 minutes.</b> Cool completely, or it will taste raw."
          - note: >-
              <b>You should bake this exactly once, and you should eat a whole slice of it.</b> Galen's ranking
              is not snobbery — it is a caloric observation, and it is correct. This loaf gives you less energy
              per bite than any other on the page while filling you up faster and moving through faster, which
              is a bad combination if bread is 70% of your calories and you dig vineyards for a living. Every
              food-history page that treats the Roman poor as accidentally healthy for eating wholegrain is
              reading a modern problem backwards. <b>The bran was the punishment.</b>
        swap: >-
          <b>Bolting tailings</b> <span class="arrow">→</span> <b>your own, from the sidebar.</b> This is the
          one loaf on the page you cannot honestly buy the ingredients for, because the whole point of it is
          that it is <i>what was left</i> — commercial bran is a clean, uniform, deliberately produced product,
          and the real thing was sweepings. Sift 1 kg of wholemeal, bake the white as <i>siligineus</i>, and
          bake the tailings as this. <b>Two loaves, one grain, opposite ends of the Roman world.</b> That
          experiment is the reason this section exists.
      - name: Pliny's leaven
        date: 1st c. AD · a sidebar
        prov: >-
          <i>Natural History</i> XVIII.26, "The various kinds of leaven." Four methods, two of them seasonal.
        historical:
          - steps:
              - >-
                <b>Millet and must.</b> "Millet is more particularly employed for making leaven; and if kneaded
                with must, it will keep a whole year."
              - >-
                <b>Wheat bran and white must.</b> Finest bran "kneaded with white must three days old, and then
                dried in the sun," formed into small cakes. To use: soaked in water, then boiled with fine spelt
                flour.
              - >-
                <b>Barley cakes soured in the dark.</b> Barley and water into two-pound cakes, baked on a hot
                hearth or in an earthen dish on ashes and charcoal until reddish-brown, then sealed away "until
                they turn quite sour." Steeped in water when needed. <b>The only one of the three leaven-cakes
                you can make year-round</b> — the other two need must, so they're vintage-only.
              - >-
                <b>Yesterday's dough.</b> "A little of the dough that has been kept from the day before." The
                everyday bakery practice, then as now.
          - p: >-
              Pliny also records the Greek convention of roughly eight ounces of leaven per <i>modius</i> of
              meal — a small-percentage levain — and, separately, that Gaulish and Spanish bakers skimmed <b>beer
              barm</b> for a lighter loaf than anywhere else.
        kitchen:
          - text: >-
              You already have Lev'blé, so treat this as an experiment rather than a need. <b>Method 1, over
              4–5 days:</b> 2 cups millet flour (or T80), 2 cups grapes — <b>unwashed</b>, the bloom is the
              whole point — 2 cups tepid water. Crush the grapes in cheesecloth, drain the excess, and bury
              the pouch in the flour-and-water slurry. Keep warm, loosely covered. Once it bubbles, at day 2–3,
              pull the pouch and transfer to a clean jar; feed ½ cup flour and ½ cup water. Feed again on days
              3–4. By day 5 it should be vigorously active.
          - text: >-
              Maintain it however you already maintain your Lev'blé — there is no need to keep a second,
              stiffer starter for the Roman breads on this page. They run at 52–58% hydration, which a wet
              starter would fight, so the formulas simply use <b>less of it</b>: about 4.6% of the flour,
              where a stiff levain ran 10–25%. At that dose the water it carries is too small to move the
              dough, and you pay for it in fermentation time instead.
        swap: >-
          <b>Millet flour</b> <span class="arrow">→</span> <b>T80</b> works, though millet is cheap and worth
          buying for one experiment. <b>Must</b> <span class="arrow">→</span> crushed fresh grapes, skins
          on. Given your cellar, the wild yeast on a bunch of unwashed wine grapes at harvest is exactly the
          material Pliny meant.
      - name: Cato's <i>panis depsticius</i>
        date: c. 160 BC · Rome
        prov: <i>De Agri Cultura</i>, ch. 74. The whole recipe, essentially in full.
        historical:
          - p: >-
              Verbatim: <i>"Wash your hands and a bowl thoroughly. Pour meal into the bowl, add water gradually,
              and knead thoroughly. When it is well kneaded, roll out and bake under a crock."</i>
          - p: >-
              Note what's absent: <b>no leaven, no salt, no quantities.</b> <i>Depsticius</i> means "well-kneaded"
              — the kneading <i>is</i> the recipe. The "crock" is the <b><i>testum</i></b>, an earthenware dome
              set over the loaf on the hearth and heaped with coals.
        kitchen:
          - form:
              rows:
                - item: Khorasan wholemeal
                  amount: 500 g · 100%
                - item: Water
                  amount: 300 g · 60%
              total:
                item: One flat loaf
                amount: 800 g
          - text: >-
              Knead hard for a full 10 minutes — this is the only instruction Cato gives, so honour it. Flatten
              to ~2 cm. Bake under a preheated Dutch oven or heavy inverted pot on the oven floor at <b>220
              °C for 30–40 minutes</b>. Add 8 g salt if you want it edible by modern standards, but it isn't
              in Cato.
          - note: >-
              Two more from the same chapters, if you're curious. <b><i>Libum</i></b> (ch. 75): 655 g fresh
              cheese to 327 g flour, one egg, baked slowly under a crock on bay leaves — a 2:1 cheese-to-flour
              ratio, which is why it's a cheesecake with flour in it rather than a bread. <b><i>Placenta</i></b>
              (ch. 76): the honey-and-sheep's-cheese layer cake. The EXARC replication found that the <i>tracta</i>
              pastry sheets <b>dissolve into the filling unless you use the soaked-farro paste</b> — that step
              raises hydration from 48% to 75% and is the difference between layers and mush.
        swap: >-
          <b>Emmer / coarse meal</b> <span class="arrow">→</span> <b>khorasan wholemeal.</b> Cato just says
          <i>farina</i>, so anything coarse and period-plausible is defensible; khorasan is the closest thing
          you own to what a Republican farmstead would have milled. <b><i>Testum</i></b> <span class="arrow">→</span>
          <b>Dutch oven, inverted, preheated.</b>
      - name: Buccellatum
        date: Roman army ration
        prov: >-
          The twice-baked biscuit that fed the legions. Named separately from bread in Constantius's 360 CE
          constitution: <i>"buccellatum and bread, wine and vinegar."</i>
        historical:
          - p: >-
              Pliny lists <i>panis militaris castrensis</i> among the bread types and notes it is <b>heavier
              than other kinds</b>. Zonaras glosses buccellatum as a <b>ring-shaped roll</b> — the annular form
              matters, for stringing and for drying evenly.
          - p: >-
              The number to bake to: <b>rebaking 850 g of bread yields about 650 g of biscuit</b>, roughly a
              <b>24% weight loss on the second bake</b>, with minimal nutritional loss and a keeping time of
              a month or more. No fat, ever — fat goes rancid, which is the whole reason it isn't there.
        kitchen:
          - form:
              rows:
                - item: Khorasan, milled and sifted to semola grade
                  amount: 453 g · 100%
                - item: Water
                  amount: 237 g · 52%
                - item: Lev'blé
                  amount: 21 g
                - item: Salt
                  amount: 6 g
              total:
                item: ~10 small rings
                amount: 717 g
          - steps:
              - Knead smooth. <b>Rest overnight.</b>
              - Shape small rings, 8–9 cm across. Rest 30 minutes.
              - >-
                <b>First bake: 200 °C, 30 minutes.</b> Cool completely — this matters, the biscuit has to set
                before it dries.
              - >-
                <b>Second bake: 150 °C, 45–90 minutes.</b> Weigh them and bake to the number, not the clock —
                you are driving off about a quarter of the original weight as water, and that takes far longer
                than most twice-bake recipes admit.
              - "Store in a cloth bag somewhere dry. To eat: soak in wine, <i>posca</i> or soup."
        swap: >-
          <b>Re-milled durum semolina</b> <span class="arrow">→</span> <b>khorasan, sifted.</b> Both are <i>T.
          turgidum</i>; mill coarse and sift the bran out and you have a very fair semola. This is the recipe
          where khorasan's tetraploid identity is doing exactly the job durum did.
  - title: IV. Medieval and early modern
    recipes:
      - name: Pain de méteil
        date: Medieval → 19th c. · France
        prov: >-
          Rye and wheat sown together and threshed together — crop insurance that became a bread. <i>Méteil</i>
          from Latin <i>mistilium</i>, "mixed."
        historical:
          - p: >-
              The legal definition still reserves the name for wheat and rye <b>grown and threshed together</b>,
              rye at 50% or more — not blended at the mill afterward. It fed rural France for eight centuries:
              Massif Central, Auvergne, Brittany, the Alps, the Ardennes, the Vosges. <i>Froment</i> was for
              towns and for people with money.
          - p: >-
              Gervase Markham, 1615, gives the practical instruction that period bakers actually needed, and
              it's the one modern recipes leave out: <b>"because Rye is a little stronger grain than wheat it
              shall be good for you to put your water a little hotter then you did to your wheat."</b>
        kitchen:
          - form:
              rows:
                - item: Rye, freshly milled
                  amount: 642 g · 55%
                - item: T80 Bise
                  amount: 525 g · 45%
                - item: Water (warm for the rye)
                  amount: 803 g · 69%
                - item: Lev'blé
                  amount: 54 g · 4.6%
                - item: Salt
                  amount: 20 g · 1.7%
              total:
                item: Two loaves
                amount: 2044 g
          - steps:
              - Mix 10 minutes. Warm water for the rye fraction, per Markham.
              - >-
                Bulk <b>5–6 hours</b> at 24 °C, or overnight in the fridge. Rye moves faster than the wheat
                loaves above even at this dose — look for a domed, bubbled surface rather than a set number
                of hours.
              - >-
                Shape, final proof 60 minutes. Rye will not double — 30–50% is the target and waiting longer just
                collapses it.
              - >-
                Dust with rye, score a cross. <b>Bake 250 °C with steam for 15 minutes, then 220 °C for 30–35
                minutes.</b>
              - >-
                Wait <b>24 hours before slicing.</b> Non-negotiable with this much rye — the starch has to retrograde
                or you'll cut into gum.
          - note: >-
              <b>To go fully faithful:</b> mill your rye and wheat berries <i>together</i> in one pass rather
              than blending two flours. That's what the word actually means, and it's a distinction you're equipped
              to make.
        swap: >-
          <b>Rye</b> <span class="arrow">→</span> <b>your rye berries.</b> <b><i>Froment</i></b> <span class="arrow">→</span>
          <b>T80</b>, or T110 for a darker, more rural loaf. Nothing here needs substituting — this is the
          one bread in the collection you can bake entirely from stock, tonight.
      - name: Markham's cheat bread
        date: 1615 · England
        prov: >-
          The fullest period English bread method that survives, from <i>The English Huswife</i>. Everyday
          bread — one rung below manchet.
        historical:
          - p: >-
              Three things worth stealing from Markham's text. <b>The overnight sponge:</b> strained sour leaven
              and warm water stirred into part of the flour until it is <i>"as thick as a pancake batter,"</i>
              then <i>"cover it all over with meal, and so let it lie all that night."</i> Covering a wet sponge
              with dry flour instead of a cloth — it skins over and protects itself.
          - p: >-
              <b>The salted leaven:</b> the piece saved from the last batch is <i>"well filled with salt, and
              so laid up to sour."</i> Salting a levain to slow it between weekly bakes.
          - p: >-
              <b>The maslin licence,</b> verbatim: <i>"you may bake any bread leavened or unleavened whatsoever
              whether it be simple corn, as Wheat or Rye of itself, or compound grain as wheat and rye, or wheat,
              rye and barley, or rye and barley."</i> The whole medieval grain ladder, in one sentence, treated
              as one method.
          - p: >-
              Note also that the Assize of Bread ladder — simnel, wastel, cocket, whole wheat, treet, horsebread
              — is <b>a sieving ladder, not a recipe ladder.</b> The wheaten grades are the same dough. What
              changes is the bolting cloth, and therefore the extraction rate. Which is exactly what your T
              numbers are.
        kitchen:
          - form:
              rows:
                - item: T110 (or T80 + 15% rye)
                  amount: 1133 g · 100%
                - item: Water, warm
                  amount: 667 g · 59%
                - item: Lev'blé
                  amount: 52 g · 4.6%
                - item: Salt
                  amount: 18 g · 1.6%
              total:
                item: Two large loaves
                amount: 1870 g
          - steps:
              - >-
                <b>Evening:</b> break the Lev'blé into warm water, strain it, and pour into a well in about a
                third of the flour. Stir to <b>pancake-batter consistency</b>. Now cover the batter with the remaining
                dry flour and leave overnight, uncovered under its own flour blanket.
              - >-
                <b>Morning:</b> stir everything together with a little more warm water and the salt. <i>"Knead
                it, break it, and tread it"</i> — Markham means work it hard.
              - Bulk 2–3 hours. Shape <i>"reasonable big loaves."</i>
              - >-
                Bake at <b>230 °C for 20 minutes, then 200 °C for 30</b>. Markham says "an indifferent good heat,"
                which is about right.
          - note: >-
              For <b>manchet</b> instead — the top of the ladder — go T65 at <b>~58%</b> and keep it deliberately
              stiff — the 1594 text says <i>"as hard as ye can handle it… without any more liquor,"</i> and
              read literally its quantities come out around 33%, which is damp crumbs rather than dough, so
              the period wording is doing rhetorical work. Here's the counterintuitive part: <b>bake it at 105
              °C for an hour and keep the crust pale.</b> Period manchet was a soft-crusted white bread, not
              a golden one.
        swap: >-
          <b>Cheat-grade meal</b> <span class="arrow">→</span> <b>T110</b>, which sits almost exactly where
          "bolted through a more coarse bolter than was used for your manchets" lands. <b>Manchet</b> <span
          class="arrow">→</span> <b>T65</b>. <b>Ale barm</b> <span class="arrow">→</span> <b>Lev'blé</b>,
          though Markham's own distinction is worth knowing: manchet is barm-leavened only, cheat bread is
          sourdough-leavened with barm secondary.
  - title: V. Still baked today
    recipes:
      - name: Scottish oatcakes and bere bannock
        date: Continuous tradition
        historical:
          - p: >-
              <b>Oatcakes</b> are a ratio, not a recipe: oatmeal 100 / fat 7–15 / hot water 40–50 / salt ~1.
              The soda in most modern versions is a 19th-century addition; the old cake is meal, water, salt
              and dripping. The two-stage finish is what makes them keep — set on the girdle until the edges
              curl, then stand the farls in a <b>banna-rack</b> before an open fire to dry through.
          - p: >-
              <b>Bannock:</b> the old one is unleavened barley, bere or oat meal, water or buttermilk, salt,
              cooked on a girdle or straight on a flat sandstone <b>bannock stane</b>. Every "traditional bere
              bannock" recipe online is the post-1840s chemically-raised version, and the wheat flour in all
              of them is there purely to compensate for bere's near-total lack of gluten.
          - p: >-
              <b>Bere</b> is a six-row barley landrace, possibly Neolithic, "probably Britain's oldest cereal
              in continuous commercial cultivation" — still grown on 5–15 hectares in Orkney and milled at Barony
              Mill, Birsay.
        kitchen:
          - subhead: <b>Oatcakes</b>
          - form:
              rows:
                - item: Oatmeal — 100 g medium + 100 g fine
                  amount: 200 g · 100%
                - item: Lard or beef dripping, melted
                  amount: 14 g · 7%
                - item: Boiling water
                  amount: 90 g · 45%
                - item: Salt
                  amount: 2.5 g
          - text: >-
              Stir the melted fat and salt into the meal, add boiling water, work fast to a stiff dough. Roll
              on a meal-strewn board to <b>3 mm</b> and cut 15 cm rounds — this batch gives you about five —
              quartering each into farls. Girdle or dry pan at <b>moderate</b> heat — you are drying, not browning
              — 5–8 minutes a side, then finish in a 120 °C oven for 20 minutes to dry through. Use pinhead
              oatmeal instead of medium for the coarse Highland version.
          - subhead: <b>Pre-modern bere bannock</b> — reconstructed by stripping the modern additions out
          - form:
              rows:
                - item: Beremeal or barley wholemeal
                  amount: 250 g · 100%
                - item: Buttermilk or water
                  amount: 150 g · 60%
                - item: Salt
                  amount: 3 g
          - text: >-
              No flour, no soda, no cream of tartar. Bring to a soft dough, pat to <b>1 cm</b>, cook on a hot
              <b>dry ungreased</b> girdle 5 minutes a side until dry-surfaced and speckled, then dry at the
              oven door. Dense and crumbly by design.
        swap: >-
          <b>Oatmeal</b> <span class="arrow">→</span> buy it, and buy <b>two grades</b>; the grade is the
          recipe. <b>Beremeal</b> <span class="arrow">→</span> ordinary hulled barley, wholemeal, is a fair
          stand-in — bere is a landrace of the same species, and its distinctiveness is agronomic (a 90-day
          barley for a short northern summer) more than culinary.
      - name: Norwegian flatbrød &amp; Breton galette
        date: Continuous tradition
        historical:
          - p: >-
              <b>Flatbrød.</b> The Norwegian ratio is stated cleanly in the literature: <b>6–7 dl liquid per
              kg of meal — 60–70% hydration — plus 1 tsp salt per kg.</b> Barley, oat and rye, alone or mixed.
              The water goes on <b>boiling</b>, poured over the salted meal — a scald, which is what makes gluten-free
              meal rollable at all. As the Norwegian sources put it: <i>"kjevlingen er største kunsten"</i>
              — the rolling is the whole craft.
          - p: >-
              <b>Breton galette.</b> Ancestral formula: buckwheat, water, salt. Nothing else. The egg is a modern
              domestic adaptation. Hydration is around <b>200%</b> — this is a batter — with <b>4% salt</b>,
              which reads as wildly high until you taste it. The <b>24–48 hour cold rest</b> is the real technique:
              it develops the elasticity, the browning and the characteristic lacy holes. Buckwheat flour goes
              stale in about two months and freshness is named repeatedly as the single biggest quality variable.
        kitchen:
          - subhead: <b>Flatbrød</b>
          - form:
              rows:
                - item: Barley meal (or 50 barley / 30 oat / 20 rye)
                  amount: 500 g · 100%
                - item: Boiling water
                  amount: 325 g · 65%
                - item: Salt
                  amount: 3 g
          - text: >-
              Pour the boiling water over the salted meal, work firm, bag it and <b>chill until cold through</b>
              — overnight is fine and better. Portion ~150 g per leaf. Dust the board heavily with barley flour
              and roll from the centre outward, as thin as you physically can. Bake on a dry pan or griddle
              at moderate heat until the surface dries, flip, finish to light brown spots. <b>Dry at 100 °C
              with the oven door ajar.</b> Stores for months.
          - subhead: <b>Galette de blé noir</b> — the crêpier's formula, no egg
          - form:
              rows:
                - item: Buckwheat flour, fresh
                  amount: 500 g · 100%
                - item: Water — half on day 1, half on day 2
                  amount: 1000 g · 200%
                - item: Guérande sea salt
                  amount: 20 g · 4%
          - text: >-
              <b>Day 1:</b> mix the flour, salt and 500 ml water. Work it by hand with a claw grip, then <b>slap
              the batter with your palm for two minutes</b> to aerate it. Cover, refrigerate. <b>Rest 24 hours
              minimum, 48 better.</b> <b>Day 2:</b> out an hour ahead, whisk in the remaining 500 ml. Cook on
              a very hot greased pan or billig, <b>~200–240 °C, about a minute, traditionally one side only.</b>
        swap: >-
          <b>Buckwheat</b> <span class="arrow">→</span> <span class="no"><b>buy it, and buy it fresh.</b></span>
          No substitute exists — buckwheat isn't even a grass. <b>Barley/oat meal</b> <span class="arrow">→</span>
          the flatbrød is the one place your <b>rye</b> genuinely belongs in the mix; rye is standard in the
          Norwegian blends.
      - name: Siyez ekmeği — 100% einkorn
        date: Kastamonu, Turkey
        prov: >-
          The bread that closes the loop. Einkorn survives as a living crop in Kastamonu — over 900 farmers
          still grow <i>siyez</i>.
        historical:
          - p: >-
              <b>Be clear about what's traditional here.</b> The Slow Food Presidium in Kastamonu is for <b>siyez
              <i>bulgur</i>, not bread</b>: spikelets boiled 20 minutes, cooled, sun-dried, cracked at the mill
              until "split in two like the wings of a mosquito," re-dried, eaten as pilaf. That's where the
              calories went. A Turkish food-science paper on siyez in breadmaking says flatly that its "bread
              production quality was found to be low," and the marketed 100% siyez loaf is a <b>modern revival
              product</b>.
          - p: >-
              Where einkorn bread genuinely was traditional and genuinely was 100%, the record points to the
              western Rif in Morocco — einkorn as <i>skaliah</i>, "used for bread, either pure or mixed with
              other cereal and legume flours" — and to living memory in Transylvania and Slovakia, "valued for
              its specific taste." In all of them it's flat or griddle-baked, not a risen loaf.
        kitchen:
          - form:
              rows:
                - item: Einkorn wholemeal, freshly milled
                  amount: 583 g · 100%
                - item: Water, cold
                  amount: 342 g · 59%
                - item: Lev'blé, active
                  amount: 27 g · 4.6%
                - item: Salt
                  amount: 9 g · 1.5%
              total:
                item: One loaf · total hydration ~60%
                amount: 961 g
          - steps:
              - >-
                <b>Autolyse 30 minutes</b>, flour and water only. Sixty percent will feel dry for a wholemeal
                — that's correct. Einkorn holds far less than the T65 number your hands are calibrated to, and
                the usual first mistake is drowning it.
              - >-
                Add Lev'blé and salt. Mix <b>3 minutes and stop</b> — past the first couple of minutes you are
                breaking down the little gluten network einkorn has rather than building it.
              - >-
                Three gentle coil folds, one hour apart. Bulk ends at about <b>50% rise, not doubled.</b> Einkorn
                does not survive a full proof.
              - >-
                Shape without tension — it won't hold any. <b>Cold retard 12–18 hours</b> in a banneton; the cold
                is what gives you a handleable dough.
              - Bake from cold, covered, <b>230 °C for 25 minutes, then uncovered at 200 °C for 20.</b>
          - warn: >-
              <b>Set expectations.</b> Deep yellow crumb — einkorn carries 8.7–11.3 mg/kg of carotenoids against
              about 1.0 in common wheat, and that figure is solid. Tight, even, low-volume crumb. Measurably
              softer with your Lev'blé than with baker's yeast, an effect specific to einkorn — common wheat
              barely notices the difference. Don't chase oven spring. It won't come, and the loaf is good anyway.
          - note: >-
              <b>The more historically honest version:</b> take the same dough, divide into 6, roll to 5 mm
              and bake on a stone at 280 °C for 3 minutes a side. That flat, dense, deep-yellow thing is what
              100% einkorn bread actually was for most of its history — and it's what the Moroccan, Transylvanian
              and Anatolian traditions all point at.
        swap: >-
          <b>Siyez</b> <span class="arrow">→</span> <b>your einkorn berries.</b> Same species, and the Turkish
          landrace has no functional advantage over what you have. <b>The one real conversion here is the
          format:</b> the loaf is modern, the flatbread is old. Bake both and you'll see immediately why history
          chose the flatbread.
  - title: VI. Holiday and ritual breads
    recipes:
      - name: Libum
        date: c. 160 BC · Rome
        prov: >-
          Cato the Elder's <i>De Agri Cultura</i>, ch. 75 — one of the two oldest written cake recipes to
          survive antiquity, alongside <i>placenta</i> two chapters later in the same manual.
        historical:
          - p: >-
              The Latin is short and complete: <i>"Libum hoc modo facito. Casei P. II bene disterat in mortario.
              Ubi bene distriverit, farinae siligineae libram aut, si voles tenerius esse, selibram similaginis
              eodem indito permiscetoque cum caseo bene. Ovum unum addito et una permisceto bene. Inde panem
              facito, folia subdito, in foco caldo sub testu coquito leniter."</i> Break two pounds of cheese
              well in a mortar, work in a pound of wheat flour — or half a pound of fine flour, <i>si voles
              tenerius esse</i>, "if you want it more delicate" — add one egg, mix, shape into a loaf, lay it
              on bay leaves, and bake slowly on a hot hearth under an earthen pot (<i>testu</i>).
          - warn: >-
              <b>No honey is in this recipe.</b> Cato's dough is cheese, flour and egg — nothing else. The
              honey most modern versions add is a serving garnish poured on afterward, not a mixed-in ingredient.
              Cato's <i>placenta</i>, two chapters later, is the one that genuinely calls for honey — four and
              a half pounds of it, worked into the cheese filling of a layered pastry. Reach for that recipe,
              not this one, if you want honey baked into the object itself.
          - p: >-
              Libum was a household offering, left at the <i>lararium</i> for the Lares and Penates on the
              Kalends, Nones and Ides and at private festivals and birthdays, with the family eating whatever
              the gods didn't. Cato's Roman pound (<i>libra</i>) is 327 g, lighter than a modern pound, so his
              2:1:~1 ratio of cheese to flour to egg scales down cleanly.
        kitchen:
          - form:
              rows:
                - item: Fresh ricotta or well-drained fresh cheese
                  amount: 327 g · 200%
                - item: T65 Blanche
                  amount: 164 g · 100%
                - item: Egg, large
                  amount: 55 g · 34%
                - item: Bay leaves, fresh if possible
                  amount: 4–6 leaves
              total:
                item: One small loaf
                amount: ~546 g
          - steps:
              - Break up the cheese thoroughly in a mortar or bowl until smooth — no lumps should survive.
              - >-
                Work in the flour, then the beaten egg, mixing well after each addition. The dough will be soft,
                closer to a thick batter than a kneadable dough.
              - Shape into a rough loaf by hand — no tin. Lay bay leaves on a tray and set the loaf on top of them.
              - Cover with an inverted terracotta pot or heavy bowl to mimic the <i>testu</i>, sealing in the heat.
              - >-
                Bake at <b>180 °C for 35–40 minutes</b>, covered throughout — Cato's <i>leniter</i>, "slowly,"
                argues against a hot, fast bake.
          - note: >-
              Serve warm, with honey, pomegranate syrup or crushed nuts if you want the modern finish —
              historically defensible as a serving choice, not as an ingredient. Texture lands between a dense
              cheesecake and a savoury flatbread; the bay leaves perfume the crust more than you'd expect.
        swap: >-
          <b><i>Siligo</i> / fine wheat flour</b> <span class="arrow">→</span> <b>T65 Blanche</b>, same logic
          as the <i>artolaganon</i> and <i>panis siligineus</i> above. <b>Roman fresh cheese (<i>caseus</i>)</b>
          <span class="arrow">→</span> <b>ricotta</b> — most reconstructions agree on this; a well-drained
          farmer's cheese also works and is arguably closer to the original's dryness.
      - name: Vasilopita
        date: AD 370s (by legend) · Greece
        prov: >-
          Greek Orthodox New Year's bread, tied to the feast of St. Basil the Great (1 January). The saint's
          life is solidly 4th-century; the coin-in-bread custom itself is not attested that early.
        historical:
          - p: >-
              The founding story: Basil, bishop of Caesarea in Cappadocia (330–379), had to return a ransom
              of gold and jewelry that the city's citizens had pooled to buy off a siege, with no record of
              who had given what. His solution — bake the treasure into loaves and distribute them, so each
              family recovered its own by what later tellers call a small miracle — survives only in later
              hagiography and local legend, not in Basil's own considerable surviving writings.
          - warn: >-
              <b>Be careful with the dates repeated online.</b> Most popular accounts state flatly that the
              custom "commenced in the fourth century." What's fourth-century is Basil himself and the
              charity-distribution legend attached to him. The specific practice of baking an actual coin into
              a New Year loaf and cutting it in a fixed order (Christ, the Virgin, St. Basil, then the household
              by age) is documented as a living Greek folk custom mainly from early-modern and 19th–20th century
              ethnography, not from any Byzantine source describing bread. Treat the saint's-life connection
              as traditional attribution rather than a continuously documented practice back to the 4th century.
          - p: >-
              The modern loaf is enriched and orange-scented rather than plain — egg, sugar, butter or oil,
              orange zest, often mastic or mahlab (the same aromatic seed used in tsoureki), and is sometimes
              made as a custard-based <i>galatopita</i> instead of a yeasted dough at all. Thessaly swaps in a
              savoury pork-and-phyllo pie, <i>chronópita</i>. None of this is fixed by any text — it's a live,
              regionally variable tradition.
        kitchen:
          - form:
              rows:
                - item: T65 Blanche
                  amount: 500 g · 100%
                - item: Whole milk, warm
                  amount: 150 g · 30%
                - item: Sugar
                  amount: 100 g · 20%
                - item: Butter, softened
                  amount: 100 g · 20%
                - item: Eggs, 2 large
                  amount: 110 g · 22%
                - item: Lev'blé
                  amount: 23 g · 4.6%
                - item: Orange zest
                  amount: 1 orange
                - item: Mahlab or mastic, ground
                  amount: 1 tsp
                - item: Salt
                  amount: 6 g · 1.2%
                - item: A clean coin
                  amount: 1, wrapped in foil
              total:
                item: One round loaf
                amount: ~990 g
          - steps:
              - Warm the milk to blood heat and stir the Lev'blé into it until dispersed.
              - Cream the butter and sugar, beat in the eggs one at a time, then the zest and mahlab or mastic.
              - Combine wet and dry ingredients, knead 8–10 minutes to a smooth, soft dough.
              - >-
                Bulk <b>8–9 hours</b> at 24 °C, until doubled. The butter and sugar slow this dough, so at the
                standard Lev'blé dose it runs longer than the lean T65 loaves above, not shorter.
              - >-
                Shape into a tight round. Tuck the wrapped coin into the underside of the dough before final proof
                — or press it in from the bottom after baking, if you'd rather not bake a foil packet.
              - Final proof <b>2–3 hours</b> at 24 °C, until puffy and slow to spring back.
              - >-
                Bake at <b>180 °C for 35–40 minutes</b>, tenting with foil if the top browns too fast. Score a
                cross into the surface before baking, in the traditional cutting pattern.
          - note: >-
              Cut at midnight on New Year's, in order: a slice for Christ, one for the Virgin, one for St.
              Basil, then the household by age. Whoever gets the coin has the year's luck — no reconstruction
              needed there, just the custom itself.
        swap: >-
          This one has no ancient grain to chase — it's a modern enriched dough, the same family as tsoureki
          or challah. <b>T65 Blanche</b> is the right call; there's no fidelity argument for anything coarser
          here, since every attested version of this bread is a refined, festive loaf by design.
      - name: Korovai
        date: 10th–11th c. · East Slavic
        prov: >-
          East Slavic ceremonial wedding bread — Ukrainian, Russian, Belarusian, with cognates across Poland
          and the Balkans. Pre-Christian in origin, but continuously documented only from Kievan Rus' onward,
          and the word is older than any surviving recipe for it.
        historical:
          - p: >-
              <i>Korovai</i> derives from Proto-Slavic <i>*korva</i>, "cow" — cattle being the sacrificial
              animal of pre-Christian Slavic ritual, with the bread standing in for the animal offering once
              agriculture displaced pastoral sacrifice. The round shape is read as solar symbolism; the size
              mattered ritually, a bigger loaf held to promise a longer, richer marriage.
          - p: >-
              Textual and folkloric documentation is genuinely old but not primary-source-ancient: wedding
              bread is attested as an established custom in Kievan Rus' from roughly the 10th–11th century,
              and detailed accounts of the baking ritual itself — who may bake it (traditionally married women
              in their first, happy marriages), the songs sung during kneading, the birds and sun-wheels molded
              onto the crust — come mainly from 19th- and 20th-century Slavic ethnographic fieldwork, the same
              era that documented most surviving Slavic folk-ritual detail.
          - warn: >-
              <b>Treat single-source popular summaries with caution.</b> Several online accounts (including
              AI-generated reference sites) name specific pre-Christian deities — Svarog, Perun — as the objects
              of korovai offerings. That link is plausible given general Slavic solar and agricultural symbolism,
              but it could not be traced here to a primary ethnographic source rather than a secondary retelling.
              The safer claim is the one everyone agrees on: pre-Christian, round, cattle-linked by name,
              sun-linked by shape.
        kitchen:
          - form:
              rows:
                - item: T65 Blanche
                  amount: 500 g · 100%
                - item: Whole milk, warm
                  amount: 150 g · 30%
                - item: Egg yolks, 4
                  amount: 72 g · 14%
                - item: Sugar
                  amount: 60 g · 12%
                - item: Butter, softened
                  amount: 80 g · 16%
                - item: Lev'blé
                  amount: 23 g · 4.6%
                - item: Salt
                  amount: 8 g · 1.6%
                - item: Dough reserved for decoration (birds, braids, sun-wheel)
                  amount: ~170 g, taken from the above
              total:
                item: One decorated loaf
                amount: ~890 g
          - steps:
              - Warm the milk to blood heat and stir the Lev'blé into it until dispersed.
              - >-
                Beat the yolks, sugar and butter together, combine with the milk mixture and flour, and knead
                10 minutes to a smooth, elastic dough.
              - >-
                Bulk <b>8–9 hours</b> at 24 °C, until doubled. Yolks and butter slow this dough the same way
                they slow the vasilopita — at this Lev'blé dose it is an overnight bulk, not an afternoon one.
              - Reserve about a fifth of the dough for decoration. Shape the rest into a large, tight round.
              - >-
                Roll the reserved dough into ropes and small shapes — a pair of birds, braided borders, a central
                sun-wheel or rosette — and press them onto the surface of the loaf.
              - Final proof <b>2–3 hours</b> at 24 °C — decorations on, and watch that they don't tear as it rises.
              - >-
                Bake at <b>180 °C for 45–55 minutes</b>, tenting with foil once the decorations start to darken,
                until deep golden and hollow-sounding.
          - note: >-
              Traditionally this loaf is enormous — big enough to need several bakers and up to three days
              of work for the most elaborate versions. This is a home-sized version; scale the flour up
              proportionally if you want the real spectacle.
        swap: >-
          Like the vasilopita, this is a modern enriched festive dough with no ancient grain to reconstruct
          — T65 is the right call. The decoration is the historically load-bearing part here, not the flour
          grade.
      - name: Egyptian funerary bread
        date: c. 1400 BC · Thebes
        prov: >-
          Real loaves, not reconstructions from residue — the best-documented ancient bread on this page
          after the Pompeii and Bronze Age finds. Bread in graves runs earlier still, back to the Predynastic
          Badarian burials. Cartwright &amp; Taylor, <i>British Museum Technical
          Research Bulletin</i> 9, 2015; the tomb of Kha and Merit, excavated 1906.
        historical:
          - p: >-
              Egyptian tombs were provisioned for eternity with an offering formula — <i>prt-xrw</i>, "a voice
              offering of bread and beer" — carved or painted so that reciting it would magically supply the
              goods forever, backed up wherever the family could afford it with actual food. The hieroglyph
              for "bread" doubled as the general sign for "food."
          - p: >-
              The tomb of the architect Kha and his wife Merit (18th Dynasty, c. 1400 BC, Deir el-Medina) held
              baskets of real bread, still recognisable after 3,500 years in Egypt's dry heat — not models, not
              paintings, actual loaves meant to feed them in the afterlife.
          - p: >-
              The British Museum's 2015 SEM survey of its own tomb-bread collection (Cartwright &amp; Taylor)
              found real variety under the microscope: plain barley loaves with whole grains and heavy chaff
              still in them, alongside several distinct loaves worked with the pulp of nabk fruit (Christ's
              thorn, <i>Ziziphus spina-christi</i>) folded directly into the dough — astringent but
              carbohydrate- and nutrient-rich, and still eaten in Egypt today. One nabk loaf (EA5360) was
              shaped leaf-like, echoing the tree iconography of Egyptian tree goddesses.
          - warn: >-
              <b>This is a separate tradition from the Egyptian mould bread elsewhere on this page.</b> That
              recipe reconstructs an everyday baking method (Bats' conical-mould loaves). This one is
              specifically about what actually got placed in tombs as offerings — often plainer bread than the
              daily loaf, sometimes fruit-enriched, and not always bread that was ever meant to be eaten by the
              living at all.
        kitchen:
          - form:
              rows:
                - item: Khorasan wholemeal, coarsely milled
                  amount: 400 g · 80%
                - item: Barley wholemeal
                  amount: 100 g · 20%
                - item: Water
                  amount: 340 g · 68%
                - item: Lev'blé
                  amount: 24 g · 4.8%
                - item: Dried dates or jujube (nabk substitute), chopped small
                  amount: 60 g · 12%
                - item: Salt
                  amount: 8 g · 1.6%
              total:
                item: One round loaf
                amount: ~930 g
          - steps:
              - Soak the chopped dates in a splash of the measured water for 15 minutes to soften.
              - Mix the flours, water, Lev'blé and salt to a shaggy dough, then fold in the softened dates.
              - >-
                Knead lightly, 4–5 minutes — don't overwork it; the grain is deliberately coarse and unsifted
                here, in keeping with the chaff-heavy tomb finds.
              - Bulk ferment 5–6 hours at 24 °C, until risen by about half.
              - Shape into a flattish round, proof 45 minutes.
              - >-
                Bake at <b>220 °C for 30–35 minutes</b>, until deeply coloured. Real tomb loaves were often
                ash-dusted or deliberately plain — resist the urge to make this one pretty.
          - note: >-
              Jujube (dried Chinese date, <i>Ziziphus jujuba</i>) is the closest supermarket relative to nabk
              (<i>Ziziphus spina-christi</i>) — same genus. Regular dried dates are a reasonable second
              substitute if jujube isn't available.
        swap: >-
          <b>Emmer/barley</b> <span class="arrow">→</span> <b>khorasan/barley</b>, same logic as the mould
          bread recipe above. <b>Nabk fruit pulp</b> <span class="arrow">→</span> <b>jujube or dried dates</b>
          — same genus or close enough in sugar and fibre content to read the same way in the dough.
